name: Validate plugins

on:
  pull_request:
    paths:
      - "plugins/**"
      - "types/**"
      - "jsconfig.json"
      - "package.json"
      - "catalog.json"
      - "scripts/generate-catalog.py"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "types/**"
      - "jsconfig.json"
      - "package.json"
      - "catalog.json"
      - "scripts/generate-catalog.py"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the catalog job can push a follow-up commit on main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate plugin manifests and layout
        run: |
          set -euo pipefail
          ID_RE='^[a-z0-9]+(-[a-z0-9]+)*$'
          declare -A seen=()

          shopt -s nullglob
          for dir in plugins/*/; do
            id="$(basename "$dir")"
            echo "Checking $id"

            if [[ ! "$id" =~ $ID_RE ]]; then
              echo "Invalid directory name: $id" >&2
              exit 1
            fi
            if [[ -n "${seen[$id]+x}" ]]; then
              echo "Duplicate id: $id" >&2
              exit 1
            fi
            seen[$id]=1

            manifest="$dir/manifest.json"
            if [[ ! -f "$manifest" ]]; then
              echo "Missing manifest.json in $dir" >&2
              exit 1
            fi

            python3 - "$manifest" "$id" <<'PY'
          import json, re, sys
          path, expected_id = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          id_re = re.compile(r"^[a-z0-9]+(?:-[a-z0-9]+)*$")
          pid = str(data.get("id", "")).strip()
          if not id_re.match(pid):
              raise SystemExit(f"manifest.id must be kebab-case: {pid!r}")
          if pid != expected_id:
              raise SystemExit(f"manifest.id {pid!r} must match directory {expected_id!r}")
          if not str(data.get("name", "")).strip():
              raise SystemExit("manifest.name is required")
          kind = str(data.get("kind", "page")).strip().lower()
          if kind not in ("page", "widget"):
              raise SystemExit('manifest.kind must be "page" or "widget"')
          entry = str(data.get("entry", "ui/index.html")).strip().lstrip("/")
          if not entry.startswith("ui/") or ".." in entry:
              raise SystemExit("manifest.entry must be under ui/")
          nav = data.get("nav")
          if not isinstance(nav, dict):
              raise SystemExit("manifest.nav is required")
          perms = data.get("permissions")
          if not isinstance(perms, dict) or not isinstance(perms.get("api"), list):
              raise SystemExit("manifest.permissions.api must be a list")
          for pattern in perms["api"]:
              p = str(pattern).strip()
              if not p.startswith("/rest/") or ".." in p:
                  raise SystemExit(f"Invalid API path: {p}")
          print("OK", pid)
          PY

            while IFS= read -r -d '' file; do
              rel="${file#$dir}"
              case "$rel" in
                manifest.json|ui|ui/*) ;;
                *)
                  echo "Disallowed file: $dir$rel" >&2
                  exit 1
                  ;;
              esac
            done < <(find "$dir" -type f -print0)

            entry="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(str(d.get("entry","ui/index.html")).strip().lstrip("/"))' "$manifest")"
            if [[ ! -f "$dir$entry" ]]; then
              echo "Entry missing: $dir$entry" >&2
              exit 1
            fi
          done

          echo "All plugins valid."

      - name: Check catalog.json is current
        if: github.event_name == 'pull_request'
        run: python3 scripts/generate-catalog.py --check

      - name: Regenerate catalog.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python3 scripts/generate-catalog.py
          if git diff --quiet -- catalog.json; then
            echo "catalog.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Regenerate catalog.json"
          git push
